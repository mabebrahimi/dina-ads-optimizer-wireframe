<section class="page" id="insights" aria-label="Insights page">
        <div class="card">
          <div class="row" style="align-items:center; justify-content:space-between;">
            <div>
              <div class="h2">Insights</div>
              <div class="muted">Campaign overview for fast triage. Open a campaign to see full insight details.</div>
            </div>
            <div class="row" style="justify-content:flex-end;">
              <select class="input" aria-label="Type" id="insightsTypeFilter">
                <option selected>All types</option>
                <option>Waste</option>
                <option>Tracking</option>
                <option>Opportunity</option>
                <option>Alerts</option>
              </select>
              <select class="input" aria-label="Severity" id="insightsSeverityFilter">
                <option selected>All severity</option>
                <option>High</option>
                <option>Medium</option>
                <option>Low</option>
              </select>
              <select class="input" aria-label="Sort" id="insightsSortFilter">
                <option selected>Sort: Impact</option>
                <option>Sort: Confidence</option>
                <option>Sort: Newest</option>
              </select>
            </div>
          </div>

          <div class="divider"></div>

          <div class="row" style="align-items:center; justify-content:space-between;">
            <div class="muted" id="insightsSummaryLine">Showing campaigns.</div>
            <div class="meta" id="insightsQuickLegend">
              <span class="tag">Campaign cards</span>
              <span class="tag">KPIs: Spend · Leads · CPL (30d)</span>
              <span class="tag">Potential improvement</span>
            </div>
          </div>
          <div class="divider" style="margin-top:10px;"></div>

          <div class="campaigns-list" id="campaignsList">
            <!-- Campaigns will be dynamically loaded here -->
          </div>
        </div>

        <div class="note">Tip: Insights are diagnostic (why + evidence). Actions live in Action Plan.</div>
      </section>
